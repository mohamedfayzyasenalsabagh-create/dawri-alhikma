# يبني تطبيق الأندرويد وينشر الموقع مع ملف التطبيق على GitHub Pages عند كل تعديل
name: نشر الموقع والتطبيق
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: publish
  cancel-in-progress: true
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.9" }
      - name: بناء التطبيق
        env:
          VERSION_CODE: "${{ github.run_number }}"
        run: gradle -p android assembleRelease --no-daemon
      - name: تجهيز ملفات الموقع
        run: |
          mkdir -p _site
          cp index.html admin.html app.js config.js seed.js style.css logo.png bg.jpg .nojekyll _site/
          cp android/app/build/outputs/apk/release/app-release.apk _site/dawri-alhikma.apk
          mkdir -p _site/admin && printf '<!doctype html><meta charset="utf-8"><meta http-equiv="refresh" content="0;url=../admin.html"><a href="../admin.html">لوحة الإدارة</a>' > _site/admin/index.html
      - name: النشر على GitHub Pages
        run: |
          cd _site
          git init -q -b gh-pages
          git config user.name "dawri-ci"; git config user.email "ci@users.noreply.github.com"
          git add -A && git commit -qm "نشر نسخة ${{ github.run_number }}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages
