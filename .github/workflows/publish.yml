# يبني تطبيق الأندرويد وينشر الموقع مع ملف التطبيق على GitHub Pages عند كل تعديل
name: نشر الموقع والتطبيق
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: publish
  cancel-in-progress: true
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.9" }
      - name: بناء التطبيق
        env:
          VERSION_CODE: "${{ github.run_number }}"
        run: gradle -p android assembleRelease --no-daemon
      - name: تجهيز ملفات الموقع
        run: |
          mkdir -p _site
          cp index.html admin.html app.js config.js seed.js style.css logo.png bg.jpg .nojekyll _site/
          cp android/app/build/outputs/apk/release/app-release.apk _site/dawri-alhikma.apk
      - name: النشر على Firebase (dawri-alhikma.web.app) وقواعد الحماية
        continue-on-error: true
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNTT || secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$SA" ]; then echo "::warning::ما في FIREBASE_SERVICE_ACCOUNT، تخطينا Firebase"; exit 0; fi
          printf '%s' "$SA" > "$RUNNER_TEMP/sa.json"
          node -e "const j=JSON.parse(require('fs').readFileSync(process.argv[1],'utf8'));console.log('مفتاح Firebase: نوع',j.type,'| مشروع',j.project_id,'| فيه private_key:',!!j.private_key,'| client_email:',!!j.client_email)" "$RUNNER_TEMP/sa.json" || { echo "::error::المفتاح FIREBASE_SERVICE_ACCOUNT مو ملف JSON كامل"; exit 1; }
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          npm i -g firebase-tools@13 >/dev/null
          firebase deploy --only hosting --project dawri-alhikma --non-interactive
      - name: النشر على GitHub Pages
        run: |
          cd _site
          git init -q -b gh-pages
          git config user.name "dawri-ci"; git config user.email "ci@users.noreply.github.com"
          git add -A && git commit -qm "نشر نسخة ${{ github.run_number }}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages
